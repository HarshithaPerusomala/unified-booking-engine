databases:
  - name: bookflow-db
    plan: free
    databaseName: bookflow
    user: bookflow

services:
  - type: web
    name: bookflow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookflow-db
          property: connectionString
      - key: PGSSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.vercel.app
      - key: NODE_ENV
        value: production
